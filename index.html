<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h3>Calculator</h3>
  </header>
  <main class="calculatork" id="calculatork">
    <input type="text" class="displaybox" id="displaybox" readonly placeholder="0"/>
    <button class="btn action" data-action="clear">C</button>
    <button class="btn action" data-action="backspace"><img src="backspace-fill.svg" alt=""></button>
    <button class="btn opt" data-value="%">%</button>
    <button class="btn opt" data-value="/">/</button>   
    <button class="btn" data-value="7">7</button>
    <button class="btn" data-value="8">8</button>
    <button class="btn" data-value="9">9</button>
    <button class="btn opt" data-value="*">*</button>
    <button class="btn" data-value="4">4</button>
    <button class="btn" data-value="5">5</button>
    <button class="btn" data-value="6">6</button>
    <button class="btn opt" data-value="-">-</button>
    <button class="btn" data-value="1">1</button>
    <button class="btn" data-value="2">2</button>
    <button class="btn" data-value="3">3</button>
    <button class="btn opt" data-value="+">+</button>
    <button class="btn zero" data-value="0">0</button>
    <button class="btn" data-value=".">.</button>
    <button id="key equals" class="btn equals" data-action="equals">=</button>
  </main>

  <script src="script.js" ></script>
</body>
</html>
